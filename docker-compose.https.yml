# Requires Docker Compose 2.24.4+ for !override.
# Use together with docker-compose.yml; see deploy/HTTPS.md.
services:
  api:
    environment:
      COOKIE_SECURE: "true"

  web:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ${COREC_NGINX_CONFIG:-./deploy/nginx.https.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/corec-acme:/var/www/certbot:ro
