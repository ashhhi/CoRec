services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-chat-completions}
      QQ_BOT_INTERNAL_TOKEN: ${QQ_BOT_INTERNAL_TOKEN:-}
      QQ_BOT_APP_ID: ${QQ_BOT_APP_ID:-}
      QQ_BOT_CLIENT_SECRET: ${QQ_BOT_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${COREC_NGINX_CONFIG:-./deploy/nginx.https.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/corec-acme:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

  qqbot:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/qq-bot.js"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      QQ_BOT_APP_ID: ${QQ_BOT_APP_ID:-}
      QQ_BOT_CLIENT_SECRET: ${QQ_BOT_CLIENT_SECRET:-}
      QQ_BOT_INTERNAL_TOKEN: ${QQ_BOT_INTERNAL_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
